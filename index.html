<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
</style>
</head>
<body>
<!-- Put your video file next to this index.html and name it video.mp4 -->
<video src="video.mp4" autoplay muted loop playsinline controls preload="auto"></video>
<script>
  // Browsers only allow autoplay when muted; first tap/click unmutes.
  const v = document.querySelector("video");
  addEventListener("pointerdown", () => { v.muted = false; v.play(); }, { once: true });
</script>
</body>
</html>
